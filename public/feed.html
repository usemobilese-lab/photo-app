<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>PhotoApp | Feed</title>
<style>
  body{font-family:Arial;margin:0;background:#f0f2f5}
  header{background:#1877f2;color:#fff;padding:10px;display:flex;align-items:center;justify-content:space-between}
  header .left{display:flex;align-items:center;gap:12px}
  header img{width:40px;height:40px;border-radius:50%;cursor:pointer}
  main{max-width:980px;margin:12px auto;display:flex;gap:16px;padding:0 12px}
  .sidebar{width:260px;background:#fff;padding:12px;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,0.06);height:fit-content}
  .feed{flex:1}
  .card{background:#fff;padding:12px;border-radius:10px;margin-bottom:12px;box-shadow:0 2px 6px rgba(0,0,0,0.06)}
  .stories-bar{display:flex;gap:12px;overflow-x:auto;padding:10px;background:#fff;border-radius:8px;margin-bottom:12px}
  .stories-bar .story{display:flex;flex-direction:column;align-items:center;width:72px}
  .story img{width:64px;height:64px;border-radius:50%;border:3px solid #1877f2;cursor:pointer;object-fit:cover}
  .small{font-size:13px;color:#666}
  form#postForm{background:#fff;padding:12px;border-radius:10px;margin-bottom:12px;box-shadow:0 2px 6px rgba(0,0,0,0.06)}
  button{background:#1877f2;color:#fff;border:none;padding:8px 12px;border-radius:6px;cursor:pointer}
</style>
</head>
<body>
  <header>
    <div class="left">
      <img id="profileAvatar" src="images/placeholder.png" alt="me">
      <div id="welcome" style="font-weight:700"></div>
    </div>
    <div>
      <button id="gotoChat">Chat</button>
      <button id="logoutBtn">Logout</button>
    </div>
  </header>

  <main>
    <aside class="sidebar">
      <h3>Your Profile</h3>
      <img id="sidePic" src="images/placeholder.png" style="width:100px;height:100px;border-radius:50%;display:block;margin:auto;object-fit:cover;cursor:pointer">
      <h4 id="sideName" style="text-align:center;margin-top:8px"></h4>
      <p id="sideBio" class="small" style="text-align:center"></p>
      <hr>
      <a href="reels.html">Go to Reels</a>
    </aside>

    <section class="feed">
      <!-- Stories bar -->
      <div id="storiesBar" class="stories-bar">
        <div class="story">
          <label for="storyUpload"><img id="myStoryPic" src="images/placeholder.png" title="Add story"></label>
          <input id="storyUpload" type="file" accept="image/*,video/*" style="display:none;">
          <small class="small">Add Story</small>
        </div>
      </div>

      <!-- Post form -->
      <form id="postForm">
        <textarea id="caption" placeholder="Write a caption (optional)" style="width:100%;min-height:60px;padding:8px;border-radius:6px;border:1px solid #ddd"></textarea>
        <input type="file" id="media" accept="image/*,video/*">
        <div style="display:flex;justify-content:flex-end;margin-top:8px">
          <button type="submit">Post</button>
        </div>
      </form>

      <div id="postsList"></div>
    </section>
  </main>

  <!-- Story viewer modal -->
  <div id="storyViewer" style="display:none;position:fixed;left:0;top:0;width:100%;height:100%;background:black;z-index:9999;justify-content:center;align-items:center">
    <div style="max-width:94%;max-height:94%;position:relative">
      <span id="closeStory" style="position:absolute;right:10px;top:10px;color:white;font-size:24px;cursor:pointer">✖</span>
      <div id="storyContent" style="display:flex;justify-content:center;align-items:center"></div>
    </div>
  </div>

  <script src="https://cdn.socket.io/4.7.1/socket.io.min.js"></script>
  <script src="js/posts.js"></script>
  <script src="js/stories.js"></script>
  <script src="js/chat-init.js"></script>
</body>
</html>
